[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridlabeltool-v4"
version = "4.0.0"
description = "Packaged v4 of the GridLabelTool dynamic-label annotation GUI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0"]
authors = [{ name = "zxw" }]
license = { text = "MIT" }

[project.scripts]
gridlabeltool-v4 = "gridlabeltool_v4.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gridlabeltool_v4 = ["config.json"]

