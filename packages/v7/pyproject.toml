[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridlabeltool-v7"
version = "7.0.0"
description = "Packaged v7 of the GridLabelTool sampled multi-scale export workflow."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0"]
authors = [{ name = "zxw" }]
license = { text = "MIT" }

[project.scripts]
gridlabeltool-v7 = "gridlabeltool_v7.__main__:main"
gridlabeltool-v7-collab = "gridlabeltool_v7.collaboration_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gridlabeltool_v7 = ["config.json"]

