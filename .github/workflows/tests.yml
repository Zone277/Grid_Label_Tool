name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  package-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/v1
          python -m pip install -e packages/v2
          python -m pip install -e packages/v3
          python -m pip install -e packages/v4

      - name: Validate v1 entrypoint
        run: python -m gridlabeltool_v1 --help

      - name: Run v1 tests
        run: python -m unittest discover -s packages/v1/tests -v

      - name: Validate v2 entrypoint
        run: python -m gridlabeltool_v2 --help

      - name: Run v2 tests
        run: python -m unittest discover -s packages/v2/tests -v

      - name: Validate v3 entrypoint
        run: python -m gridlabeltool_v3 --help

      - name: Run v3 tests
        run: python -m unittest discover -s packages/v3/tests -v

      - name: Validate v4 entrypoint
        run: python -m gridlabeltool_v4 --help

      - name: Run v4 tests
        run: python -m unittest discover -s packages/v4/tests -v
